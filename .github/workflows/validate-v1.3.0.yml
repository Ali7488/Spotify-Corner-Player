name: Validate Spotify Corner Player v1.3.0

on:
  push:
    branches:
      - feature/v1.3.0-color-themes
  pull_request:

jobs:
  windows-static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 scripts and WPF XML
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($filename in @('Spotify-Corner-Player-v1.3.0.ps1', 'Spotify-Corner-Player-v1.2.4.ps1', 'Setup.ps1', 'Install-SpotifyPlayerLogs.ps1')) {
              $tokens = $null
              $errors = $null
              $path = Join-Path $PWD $filename
              $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref] $tokens, [ref] $errors)
              if ($errors.Count -gt 0) { throw "$filename has parse errors: $($errors | Out-String)" }
              Write-Host "Parsed: $filename"
          }
          $source = Get-Content -LiteralPath 'Spotify-Corner-Player-v1.3.0.ps1' -Raw
          $layout = [regex]::Match($source, '(?s)<Window xmlns=.*?</Window>').Value
          if (!$layout) { throw 'WPF XAML layout missing' }
          [xml] $document = $layout
          $buttons = $document.SelectNodes('//*[local-name()="Button"]')
          if (!($buttons | Where-Object { $_.GetAttribute('Name', 'http://schemas.microsoft.com/winfx/2006/xaml') -eq 'themeButton' })) {
              throw 'In-player theme button missing'
          }
          Write-Host 'WPF XML layout parsed and palette button found'
  zip-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build validated Windows ZIP
        run: bash ./Build-Release.sh
      - name: Upload preview ZIP for Windows testing
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-Corner-Player-v1.3.0-Windows-preview
          path: dist/Spotify-Corner-Player-v1.3.0-Windows.zip
          retention-days: 14
