name: Validate Spotify Corner Player v1.4

on:
  push:
    branches:
      - feature/v1.4-usability-safe-upgrades
  pull_request:
    paths:
      - "Spotify-Corner-Player-v1.4.0.ps1"
      - "Setup.ps1"
      - "Build-Release.sh"
      - ".github/workflows/validate-v1.4.yml"
      - "linux/plasma6/**"
      - "README.md"

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell 5.1, validate v1.4 XAML and migration safety
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('Spotify-Corner-Player-v1.4.0.ps1', 'Spotify-Corner-Player-v1.2.4.ps1', 'Setup.ps1', 'Install-SpotifyPlayerLogs.ps1')) {
              $errors = $null
              $tokens = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $name), [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) { throw "$name parse failed: $($errors | Out-String)" }
          }
          $source = Get-Content 'Spotify-Corner-Player-v1.4.0.ps1' -Raw
          $xml = [regex]::Match($source, '(?s)<Window xmlns=.*?</Window>').Value
          if (!$xml) { throw 'XAML missing' }
          [xml]$document = $xml
          $names = @{}
          foreach ($node in $document.SelectNodes('//*[@*[local-name()="Name"]]')) {
              $name = $node.GetAttribute('Name', 'http://schemas.microsoft.com/winfx/2006/xaml')
              if ($name) { $names[$name] = $node.LocalName }
          }
          foreach ($entry in @{compactButton='Button';repeatButton='Button';progress='Slider';recordRow='Grid';volumeRow='DockPanel';linksRow='UniformGrid';themeButton='Button'}.GetEnumerator()) {
              if ($names[$entry.Key] -ne $entry.Value) { throw "Missing $($entry.Key) as $($entry.Value)" }
          }
          foreach ($required in @('Set-CompactLayout','TryChangePlaybackPositionAsync','TryChangeAutoRepeatModeAsync','Get-ExistingInstallInfo','Assert-OwnedInstall','Backups\','Restore')) {
              if (!$source.Contains($required)) { throw "Required feature missing: $required" }
          }
          if ($source.Contains('pinButton') -or $source.Contains('Set-Pinned')) { throw 'Windows pinning explicitly excluded from v1.4' }
          $legacy = Get-Content 'Spotify-Corner-Player-v1.2.4.ps1' -Raw
          foreach ($marker in @("SpotifyCornerPlayer/1", "Spotify-Corner-Player.ps1", "Spotify Corner Player.lnk")) {
              if (!$source.Contains($marker) -or !$legacy.Contains($marker)) { throw "Legacy migration marker mismatch: $marker" }
          }
          Write-Host 'PowerShell parsed; WPF controls, v1.2.4 marker, and no-Windows-pin rules validated.'
      - name: Verify that 1.4 Setup selects 1.4 source
        shell: powershell
        run: |
          $setup = Get-Content Setup.ps1 -Raw
          if (!$setup.Contains("Spotify-Corner-Player-v1.4.0.ps1")) { throw 'Setup targets wrong version' }

  windows-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows ZIP and verify contents
        run: |
          bash ./Build-Release.sh
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("dist/Spotify-Corner-Player-v1.4.0-Windows.zip") as z:
              assert z.testzip() is None
              assert "Spotify-Corner-Player-v1.4.0.ps1" in z.namelist()
              assert "Spotify-Corner-Player-v1.2.4.ps1" in z.namelist()
              assert "Restore-v1.2.4.bat" in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify-Corner-Player-v1.4.0-Windows-preview
          path: dist/Spotify-Corner-Player-v1.4.0-Windows.zip
          retention-days: 14

  plasma6-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python installer tests and bytecode
        run: |
          python3 -m compileall -q linux/plasma6
          python3 -m unittest discover -s linux/plasma6/tests -v
      - name: Parse QML source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools
          QMLFORMAT="$(command -v qmlformat || echo /usr/lib/qt6/bin/qmlformat)"
          test -x "$QMLFORMAT"
          for file in linux/plasma6/widget/contents/ui/*.qml; do
            "$QMLFORMAT" "$file" >/dev/null
          done
      - name: Check palette JS and build Plasma ZIP
        run: |
          sed '/^\.pragma library$/d' linux/plasma6/widget/contents/ui/ThemeColors.js > /tmp/theme-colors.js
          node --check /tmp/theme-colors.js
          python3 linux/plasma6/build-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify-Corner-Player-v1.4.0-Plasma6-preview
          path: dist/Spotify-Corner-Player-v1.4.0-Plasma6.zip
          retention-days: 14
